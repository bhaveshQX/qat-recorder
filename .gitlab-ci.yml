# GitLab CI for QAT Recorder.
#
# Thin wrapper: the real definition of "green" is ci/run.sh, which also runs
# locally. Keeping the logic there means there is one thing to maintain rather
# than one per CI system.

stages:
  - test
  - integration
  - artifacts

variables:
  GIT_DEPTH: "10"

offline:
  stage: test
  image: python:3.11-slim
  script:
    - bash ci/run.sh offline

package:
  stage: test
  image: python:3.11-slim
  script:
    - bash ci/run.sh package
  artifacts:
    paths:
      - dist/*.whl
    expire_in: 1 month

# The filter can only be tested against a real X server with real input, so these
# stages need Docker-in-Docker.
native-filter:
  stage: integration
  image: docker:27
  services:
    - docker:27-dind
  script:
    - apk add --no-cache bash
    - bash ci/run.sh native

record-replay:
  stage: integration
  image: docker:27
  services:
    - docker:27-dind
  script:
    - apk add --no-cache bash
    - bash ci/run.sh replay

# Built against the OLDEST supported glibc and Qt, because old-built runs on new
# and new-built does not run on old.
portable-artifacts:
  stage: artifacts
  image: docker:27
  services:
    - docker:27-dind
  script:
    - apk add --no-cache bash
    - bash ci/run.sh portable
  artifacts:
    paths:
      - native/dist/*.so
    expire_in: 3 months
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
