# GitHub Actions for QAT Recorder.
#
# Mirror of .gitlab-ci.yml. Both are thin wrappers around ci/run.sh, which is the
# real definition of "green" and runs locally too.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash ci/run.sh offline

  package:
    name: Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash ci/run.sh package
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  native:
    name: Native filter and replay
    runs-on: ubuntu-latest
    needs: offline
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/run.sh native
      - run: bash ci/run.sh replay

  portable:
    name: Portable artifacts
    runs-on: ubuntu-latest
    needs: native
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/run.sh portable
      - uses: actions/upload-artifact@v4
        with:
          name: qatrec-native
          path: native/dist/*.so
