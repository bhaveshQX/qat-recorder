[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qat-recorder"
version = "0.1.0"
description = "Record-and-playback tooling built on Qat (Qt Application Tester)"
requires-python = ">=3.9"
# mss photographs the screen through XGetImage with ctypes: no compiler, no
# distribution package, and no ffmpeg -- which on RHEL lives in a repository
# a locked-down VM will not have. It is what makes a still at a gap show the
# pop-up that was over the application rather than the application.
dependencies = ["qat>=1.7", "fastapi>=0.100", "uvicorn[standard]>=0.20",
                "mss>=9"]

[project.optional-dependencies]
# `qat` is here as well as in dependencies on purpose: tests/test_generated_api.py
# checks every generated call against Qat's real signatures with inspect, which
# is the only thing that catches a call written from memory. It needs the
# package present, not a running application.
dev = ["pytest>=7", "PySide6-Essentials", "qat>=1.7"]
# The control panel is the only part that needs Qt bindings in the recorder
# process itself; capture, generation and replay do not.
ui = ["PySide6-Essentials"]
# ngrok is only needed if you want to expose the agent through a tunnel.
ngrok = ["pyngrok>=7"]

[project.scripts]
qat-recorder = "qat_recorder.cli:main"
# Runs on the VM beside the application. Needs only the standard library and
# `qat` -- no web framework, so it installs on a locked-down host.
qat-recorder-agent = "qat_recorder.agent.cli:main"

[project.gui-scripts]
qat-recorder-panel = "qat_recorder.ui.panel:main"
qat-recorder-web = "qat_recorder.cli:_cmd_web_panel"

[tool.setuptools.packages.find]
include = ["qat_recorder*"]

[tool.setuptools.package-data]
# The launcher wrapper and the C++ source are both needed at runtime on the VM,
# so they must travel inside the wheel rather than being found relative to a
# source checkout. The web/static/ directory holds the pre-built React UI.
qat_recorder = ["resources/*.sh", "resources/native/*", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["live: requires a running application under test (needs --live)"]
